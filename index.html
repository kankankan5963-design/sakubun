<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>作文フィッシング</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 海図（ノーティカルチャート）。方眼の入った明るい海色の紙に、紺のインクと信号旗の赤。
   漢検・英語アプリと混同しないよう、明るい単一テーマで固定 */
:root{
  --sea:#e4f2f5; --paper:#ffffff; --grid:#d0e6ec; --ink:#14304f; --sub:#4f6a80; --line:#b4d0db;
  --signal:#e8453c; --signal-d:#a82a21; --teal:#0e8a86; --q:#2463d6; --qbg:#d4e2ff; --cond:#8a5f00; --cbg:#ffe08a;
  --sun:#ffc93c; --ok:#1f9d55; --okbg:#e3f6ea; --ng:#d93a3a; --ngbg:#fde8e8; --navy:#14304f; --night:#0d2238;
  --f-disp:"Dela Gothic One","BIZ UDPGothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--sea);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--q);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:22px} h2{font-size:18px}
.small{font-size:13px;color:var(--sub);font-family:var(--f-body)}
.disp{font-family:var(--f-disp)}

/* ヘッダー：紺の帯＋信号旗のしま */
.mast{margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-left,0px)) 12px;background:var(--navy);color:#fff;
  display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:6px solid transparent;
  border-image:repeating-linear-gradient(90deg,var(--signal) 0 16px,#fff 16px 32px) 6}
.mast .sub{font-size:12px;color:#bcd3e3;font-family:var(--f-body)}
.tbtn{background:none;border:2px solid #4e6f8f;border-radius:999px;padding:3px 12px;font-size:13px;color:#fff}

.card{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:14px;box-shadow:4px 4px 0 var(--ink)}
.status{display:grid;grid-template-columns:68px 1fr;gap:12px;align-items:center}
.sprbox{width:68px;height:68px;border-radius:8px;background:var(--night);display:grid;place-items:center}
canvas.spr{image-rendering:pixelated}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lv{font-family:var(--f-disp);font-size:24px;color:var(--signal)}
.ttl{font-family:var(--f-disp);font-size:15px}
.bar{height:14px;background:var(--sea);border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#3ec3b8);transition:width .5s}
.xpnum{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}

.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:10px 12px;min-width:0}
.meter b{font-family:var(--f-disp);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.2}
.meter .unit{font-size:13px;color:var(--sub);margin-left:4px}
.meter .lab{font-size:12px;color:var(--sub)}
.meter.exam{background:var(--navy);color:#fff;border-color:var(--navy)} .meter.exam .lab,.meter.exam .unit{color:#bcd3e3} .meter.exam b{color:var(--sun)}
.next{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-top:2px}
.next canvas{border-radius:4px;background:var(--night)}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.games{display:flex;flex-direction:column;gap:12px}
.gcard{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:12px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.gcard:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.gcard.locked{opacity:.55;box-shadow:none;border-style:dashed;cursor:default}
.gicon{width:46px;height:46px;display:grid;place-items:center;font-family:var(--f-disp);font-size:18px;border-radius:8px;color:#fff}
.gname{font-family:var(--f-disp);font-size:16px}
.gdesc{font-size:13px;color:var(--sub);line-height:1.5}
.check{font-family:var(--f-disp);font-size:12px;padding:3px 10px;border-radius:999px;border:2px solid var(--line);color:var(--sub);white-space:nowrap}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check.rev{border-color:var(--signal);color:var(--signal)}
.newbadge{display:inline-block;font-family:var(--f-disp);font-size:10px;background:var(--signal);color:#fff;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:2px}

.winter{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:4px 4px 0 var(--signal)}
.winter .small{color:#bcd3e3}
.dots{display:flex;gap:8px;margin-top:6px}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid #4e6f8f;display:grid;place-items:center;font-style:normal;font-size:12px}
.dots i.on{background:var(--sun);border-color:var(--sun);color:var(--navy)}

.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.route li{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:10px}
.route li:not(:last-child)::before{content:"";position:absolute;left:10px;top:20px;bottom:0;border-left:2px dashed var(--line)}
.route .pin{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--paper);margin-top:2px}
.route li.on .pin{background:var(--teal);border-color:var(--teal)}
.route .rn{font-weight:700;font-size:14px}
.route .rd{font-size:12px;color:var(--sub);line-height:1.5}
.route li:not(.on) .rn{color:var(--sub)}

.skills{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.skills li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.skills li>span:first-child{min-width:0}
.pips{display:flex;align-items:center;gap:3px;white-space:nowrap}
.pips i{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-radius:50%}
.pips i.on{background:var(--sun);border-color:#d9a400}
.mst{font-family:var(--f-disp);font-weight:400;font-size:11px;color:var(--signal);margin-left:4px}
.duemark{font-size:11px;color:var(--signal);white-space:nowrap}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
.shelf figure{margin:0;text-align:center;font-size:11px;line-height:1.35;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px}
.shelf .sprbox{width:52px;height:52px}
.shelf figure.got{color:var(--ink);font-weight:700}
.kanten{margin:0;padding-left:1.3em;font-size:14px}

/* ゲーム画面 */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px}
.back{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:14px}
.prog{font-family:var(--f-disp);color:var(--sub);font-variant-numeric:tabular-nums}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);color:var(--sub)}
.tag.past{border-color:var(--navy);background:var(--navy);color:#fff}
.tag.retry{border-color:var(--ng);color:var(--ng);background:var(--ngbg)}
.tag.rev{border-color:var(--teal);color:var(--teal)}
.tag.hard{border-color:var(--signal);background:var(--signal);color:#fff}
.howto{font-size:14px;color:var(--sub);margin:0}
.rule{font-size:14px;line-height:1.7;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 12px}

.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mode{border:2px solid var(--ink);border-radius:999px;padding:8px 4px;background:var(--paper);font-family:var(--f-disp);font-size:13px}
.mode[aria-pressed="true"].mq{background:var(--q);color:#fff;border-color:var(--q)}
.mode[aria-pressed="true"].mc{background:var(--cbg);color:var(--ink);border-color:#d9a400}
.mode[aria-pressed="true"].mn{background:var(--sub);color:#fff;border-color:var(--sub)}
.sheet{background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:14px;line-height:2.15;font-size:16px;
  background-image:linear-gradient(transparent calc(2.15em - 1px),#e7eef2 calc(2.15em - 1px));background-size:100% 2.15em}
.chunk{display:inline;cursor:pointer;padding:3px 1px;border-radius:3px;color:var(--ink);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  text-decoration:underline dashed #6f9db3 2px;text-underline-offset:5px;-webkit-tap-highlight-color:rgba(36,99,214,.15)}
.chunk:focus-visible{outline:2px solid var(--q)}
.chunk.sq{background:var(--qbg);text-decoration:underline solid var(--q) 3px;text-underline-offset:5px}
.chunk.sc{background:var(--cbg);text-decoration:underline solid #d9a400 3px;text-underline-offset:5px}
.chunk.wrong{box-shadow:inset 0 0 0 2px var(--ng)} .chunk.right{box-shadow:inset 0 0 0 2px var(--ok)}
.glue{color:var(--ink)}
.mark{font-family:var(--f-disp);font-size:12px;vertical-align:super;margin-left:2px}

.bigbtn{width:100%;padding:14px;border-radius:999px;border:2px solid var(--signal-d);background:var(--signal);color:#fff;font-family:var(--f-disp);font-size:17px;box-shadow:0 4px 0 var(--signal-d)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--signal-d)}
.bigbtn.ghost{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.bigbtn.teal{background:var(--teal);border-color:#08605d;box-shadow:0 4px 0 #08605d}

.fb{border-radius:10px;padding:12px 14px;border:2px solid var(--line);background:var(--paper);font-size:15px}
.fb.good{border-color:var(--ok);background:var(--okbg)} .fb.bad{border-color:var(--ng);background:var(--ngbg)}
.fb h3{font-size:17px;margin:0 0 6px}
.fb ol,.fb ul{margin:4px 0;padding-left:1.4em}
.qli{color:var(--q);font-weight:700} .cli{color:var(--cond);font-weight:700}
.again{font-family:var(--f-disp);color:var(--signal);margin-top:8px;font-size:14px}

.slots{display:flex;flex-direction:column;gap:8px}
.slot{border:2px dashed var(--line);border-radius:8px;padding:10px 12px;min-height:46px;font-size:14px;color:var(--sub);background:rgba(255,255,255,.6)}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--paper);color:var(--ink)}
.slot .role{font-family:var(--f-disp);font-size:12px;color:var(--teal);display:block}
.pool{display:flex;flex-direction:column;gap:8px}
.pcard{text-align:left;width:100%;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-left:8px solid var(--signal);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.8}
.pcard.shake,.choice.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.gauge{display:flex;height:22px;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--sea);position:relative}
.gauge span{display:block;height:100%;border-right:2px solid var(--paper);font-size:11px;line-height:18px;text-align:center;color:#fff;font-weight:700;overflow:hidden;white-space:nowrap}
.gauge .lim{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ng)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}

.ctx{font-size:14px;color:var(--sub)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;width:100%;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;font-size:16px;line-height:1.8;display:grid;grid-template-columns:28px 1fr;gap:8px;box-shadow:3px 3px 0 var(--ink)}
.choice .ab{font-family:var(--f-disp);font-size:18px;color:var(--sub)}
.choice.right{border-color:var(--ok);background:var(--okbg);box-shadow:3px 3px 0 var(--ok)}
.choice.wrong{border-color:var(--ng);background:var(--ngbg);box-shadow:3px 3px 0 var(--ng)}
.choice:disabled{cursor:default}
.choice .why{grid-column:2;font-size:13px;color:var(--ng);font-weight:700}

.timer{font-family:var(--f-disp);font-size:56px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.timer.warn{color:var(--signal)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks label{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;font-size:15px;background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.checks input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--teal)}

/* 演出 */
.fx{position:fixed;inset:0;pointer-events:none;display:grid;place-items:center;z-index:50}
.combo{font-family:var(--f-disp);text-align:center;color:var(--signal);text-shadow:3px 3px 0 #fff,6px 6px 0 var(--ink);animation:combo 1.2s ease-out forwards}
.combo b{display:block;font-size:54px;font-weight:400;line-height:1}
.combo small{display:block;font-size:18px;color:var(--ink);text-shadow:2px 2px 0 #fff}
@keyframes combo{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.25);opacity:1}30%{transform:scale(1)}70%{transform:translateY(-20px);opacity:1}100%{transform:translateY(-90px);opacity:0}}
.xpfloat{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-family:var(--f-disp);color:var(--teal);font-size:22px;pointer-events:none;animation:xpf 1s ease-out forwards;z-index:40;text-shadow:2px 2px 0 #fff}
@keyframes xpf{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}
.ov{position:fixed;inset:0;background:rgba(10,26,44,.9);display:grid;place-items:center;z-index:60;color:#fff;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ovbox{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;position:relative;z-index:2}
.ov .big{font-family:var(--f-disp);font-size:clamp(34px,10vw,52px);line-height:1.1;color:var(--sun);text-shadow:3px 3px 0 var(--signal-d);animation:pop .6s ease-out}
.ov .mid{font-family:var(--f-disp);font-size:clamp(22px,6vw,30px);line-height:1.3}
.ov .sm{font-size:15px;color:#cfe0ec}
.ov .pill{font-family:var(--f-disp);background:var(--signal);color:#fff;border-radius:999px;padding:6px 16px;font-size:18px}
.ov .sprbox{width:132px;height:132px;animation:spin .9s ease-out}
.ov .tap{font-size:12px;color:#8fb0c8;margin-top:6px}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes spin{from{transform:rotate(-360deg) scale(.2)}to{transform:none}}
.conf{position:absolute;top:-20px;width:10px;height:14px;animation:fall 2.6s linear forwards;z-index:1}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding-top:20px}
.res .score{font-family:var(--f-disp);font-size:42px;color:var(--signal)}
.res .note{font-family:var(--f-disp);color:var(--teal)}

/* さかな図鑑 */
.zcardbtn{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer}
.zcardbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
#zprev{background:linear-gradient(#cfe9f2,#a8d3e3);border-radius:8px;display:grid;place-items:center;min-height:62px}
.zn{font-family:var(--f-disp);font-weight:400;font-size:26px;color:var(--teal)}
.swim{position:fixed;left:0;z-index:45;pointer-events:none;display:flex;flex-direction:column;align-items:center;animation:swim 3s linear forwards}
.swim .fishcv{filter:drop-shadow(0 4px 6px rgba(10,40,60,.35));animation:bob .6s ease-in-out infinite alternate}
.catchbars{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:46;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.catchbar{font-family:var(--f-disp);font-size:18px;background:var(--navy);color:#fff;border:2px solid #fff;border-radius:999px;padding:6px 18px;box-shadow:0 4px 12px rgba(10,30,50,.35);text-align:center;animation:cb 3s ease forwards;max-width:100%}
.catchbar b{color:var(--sun);font-weight:400} .catchbar .st{color:var(--sun);font-size:14px} .catchbar small{font-size:13px;color:#bcd3e3}
@keyframes cb{0%{opacity:0;transform:translateY(-12px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
.bigbtn.auto{background-image:linear-gradient(90deg,rgba(255,255,255,.32),rgba(255,255,255,.32));background-size:0 100%;background-repeat:no-repeat;animation:fillbar 3s linear forwards}
@keyframes fillbar{to{background-size:100% 100%}}
@keyframes swim{from{transform:translateX(105vw)}to{transform:translateX(-180px)}}
@keyframes bob{from{transform:translateY(-4px) rotate(-1.5deg)}to{transform:translateY(4px) rotate(1.5deg)}}
.catches{text-align:left;width:100%}
.clist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.citem{display:grid;grid-template-columns:120px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;background:var(--sea);border:2px solid var(--line);border-radius:8px;padding:8px}
.citem .cpic{grid-row:1/4;background:linear-gradient(#e0f1f6,#bfe0ea);border-radius:6px;display:grid;place-items:center}
.citem .cn{font-weight:700;font-size:15px} .citem .cs{font-size:12px;color:var(--sub);line-height:1.5}
.citem .cs b{color:var(--signal)} .citem .cd{font-size:12px;color:var(--ng);font-weight:700}
.newb{font-family:var(--f-disp);font-weight:400;font-size:11px;background:var(--signal);color:#fff;border-radius:4px;padding:0 5px;margin-right:4px}
.newb.rec{background:var(--teal)}
.zov{position:fixed;inset:0;background:rgba(10,26,44,.75);z-index:70;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.zcard{max-width:520px;margin:20px auto;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:16px;position:relative;box-shadow:6px 6px 0 var(--signal)}
.zclose{position:absolute;right:10px;top:8px;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:20px;line-height:1}
.zpic{background:linear-gradient(#dff0f6,#b6dbe8);border-radius:8px;display:grid;place-items:center;padding:8px 0;margin-top:28px}
.zpic .fishcv{max-width:100%;height:auto}
.zhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:10px}
.zhead h2{font-size:24px}
.rare{font-family:var(--f-disp);font-size:13px;color:var(--sub)} .rare.r3,.zt-r.r3{color:#c98a00} .rare.r4,.zt-r.r4{color:var(--signal)}
.zmeta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.zmeta span{font-size:12px;background:var(--sea);border-radius:999px;padding:2px 10px}

  e:"【食べてはダメ】内臓にパリトキシンという強い毒をもつことがあり、食べると筋肉の痛みなどの中毒を起こす。釣れても持ち帰らない。",
  t:"暖かい海の魚だが、近年は本州の沿岸でも見つかるようになった。"},
 {n:"ハコフグ",r:2,a:"磯",d:1,z:[15,30],s:{k:"box",r:.5,b:"#d6a43a",u:"#e8c770",n:"#e0b85a",p:"hexdots",pc:"#3b6fd0"},
  f:"かたい骨の箱に入ったような四角い体。ゆっくり泳ぐ。",
  c:"磯や堤防でまれに釣れる。",
  e:"【食べないほうがよい】皮から毒の粘液を出し、肝臓などで中毒の例もある。長崎の五島列島には身をみそと焼く郷土料理があるが、素人は手を出さないこと。",
  t:"その形が、自動車のデザインの参考にされたことがある。"},
 {n:"シロギス",r:2,a:"砂浜",z:[15,30],s:{k:"sp",r:.2,b:"#d9c9a6",u:"#f8f4ea",n:"#e6dcc4",dor:"two"},
  f:"砂浜にすむ細長い白っぽい魚。上品な見た目から「海の女王」。",
  c:"砂浜からの投げ釣り。ジャリメ（イソメ）をエサに、仕掛けをゆっくり引いてくる。",
  e:"天ぷらが最高。刺身、塩焼き、昆布じめも。",
  t:"驚くと砂にもぐって身を隠す。"},
 {n:"シログチ",r:1,a:"砂浜",z:[20,35],s:{k:"sp",r:.28,b:"#b8bec3",u:"#f2f2f0",n:"#d0c8a8",dor:"two"},
  f:"「イシモチ」とも呼ばれる銀色の魚。",
  c:"砂浜や船からの投げ釣り。夜によく釣れる。",
  e:"塩焼き、フライ。かまぼこの原料としても使われる。",
  t:"浮き袋をふるわせて「グーグー」と鳴き、それが愚痴のようなので「グチ」。頭に大きな耳石があるので「イシモチ」。"},
 {n:"ヒラメ",r:3,a:"砂浜",z:[35,80],s:{k:"flat",r:.48,b:"#7a6a52",u:"#7a6a52",n:"#6a5a44",p:"spots",pc:"#4a3c2a"},
  f:"平たい体で、海底の砂にかくれて獲物を待ち伏せる。両目が体の左側にある。",
  c:"生きたイワシやアジをエサにする泳がせ釣りや、砂浜からのルアー。",
  e:"刺身、昆布じめ。ひれの付け根の「えんがわ」は高級。",
  t:"「左ヒラメに右カレイ」。生まれたときは普通の魚の形で、成長すると片方の目が移動する。"},
 {n:"マゴチ",r:3,a:"砂浜",z:[35,60],s:{k:"kochi",r:.17,b:"#8a7a5a",u:"#e6dccb",n:"#a08a62",p:"spots",pc:"#4a3f2a",dor:"two"},
  f:"頭が平たくつぶれた形の魚。砂にまぎれて獲物をねらう。",
  c:"夏、砂浜や河口でルアーや泳がせ釣り。エラぶたの鋭いトゲに注意。",
  e:"夏が旬で「照りゴチ」と呼ばれる。洗いや薄造りが絶品。",
  t:"小さいうちはオスで、大きくなるとメスに変わる。"},
 {n:"アカエイ",r:2,a:"砂浜",d:1,z:[40,100],s:{k:"ray",b:"#8a5a3a",u:"#e8b48a",n:"#7a4a2a"},
  f:"ひし形の平たい体と、長い尾をもつ軟骨魚類。",
  c:"砂浜の投げ釣りでかかることがある。重くて引きが強い。",
  e:"【尾に毒トゲ】尾のトゲに毒があり、刺されると激痛で病院に行くレベル。身は煮付けや煮こごりで食べる地域もある。時間がたつとアンモニア臭が出る。",
  t:"サメに近い仲間で、卵ではなく子どもを産む。"},
 {n:"ホウボウ",r:2,a:"沖（船）",z:[25,40],s:{k:"sp",r:.28,b:"#c4553a",u:"#f3e0d2",n:"#d8826a",x:["wingblue","legs"],dor:"two"},
  f:"胸びれが青い翼のように広がる。胸びれの一部が足のようになっていて、海底を歩く。",
  c:"船からのキス釣りやヒラメ釣りでまじって釣れる。",
  e:"刺身、鍋、ブイヤベース。上品な白身で、だしもよく出る。",
  t:"浮き袋で「ボーボー」と鳴くのが名前の由来という説がある。"},
 {n:"マコガレイ",r:2,a:"砂浜",z:[20,40],s:{k:"flat",r:.52,b:"#6e6048",u:"#6e6048",n:"#5e5038",p:"spots",pc:"#4a3e2a",x:["righteye"]},
  f:"体の右側に両目がある平たい魚。冬の投げ釣りの人気ターゲット。",
  c:"冬から春、砂浜や堤防からの投げ釣り。イソメをエサに、置き竿で待つ。",
  e:"煮付け、唐揚げ。大分県の「城下かれい」は有名なブランド。",
  t:"「左ヒラメに右カレイ」。ヒラメより口が小さい。"},
 {n:"マダイ",r:3,a:"沖（船）",z:[30,80],s:{k:"deep",r:.44,b:"#e05a5a",u:"#f7d2cf",n:"#e88a88",p:"spots",pc:"#6fc6f0",dor:"spiny"},
  f:"「魚の王様」。赤い体に青い点が散らばる。",
  c:"船からのタイラバやコマセ釣り。",
  e:"刺身、鯛めし、潮汁、塩焼き。どこを食べてもおいしい。",
  t:"胸びれの付け根の骨の中に、魚の形をした「鯛の鯛」と呼ばれる骨がある。"},
 {n:"ブリ",r:3,a:"沖（船）",z:[40,100],s:{k:"sp",r:.26,b:"#3c6f8a",u:"#eef3f4",n:"#c8b864",p:"yline",pc:"#e4c64a",dor:"two"},
  f:"背中が青く、体の横に黄色い線がある大型の回遊魚。",
  c:"船からのジギングや泳がせ釣り。冬の日本海が有名。",
  e:"ブリ大根、照り焼き、しゃぶしゃぶ、刺身。冬の「寒ブリ」は脂が多い。",
  t:"出世魚（関東ではワカシ→イナダ→ワラサ→ブリ）。地域で呼び名がちがう。"},
 {n:"カツオ",r:3,a:"沖（船）",z:[40,80],s:{k:"sp",r:.3,b:"#1f3d6a",u:"#e8edf2",n:"#5a6a80",p:"bellylines",pc:"#3d4f6a",dor:"two",x:["finlets"],tail:"moon"},
  f:"流線形の体で高速で泳ぐ。お腹にしま模様がある。",
  c:"船からの一本釣りが有名。ルアーやエサで狙う。",
  e:"たたき、刺身。春の「初ガツオ」はさっぱり、秋の「戻りガツオ」は脂がのる。",
  t:"泳ぎ続けて口から水を取り込まないと呼吸できない。かつお節の原料。"},
 {n:"タチウオ",r:2,a:"堤防",z:[70,130],s:{k:"ribbon",r:.1,b:"#cfd8de",u:"#eef2f4",n:"#dfe6ea"},
  f:"刀のような銀色の細長い体。立って泳ぐことからタチウオ。うろこがない。",
  c:"秋の夜の堤防で、テンヤやワインドのルアー。歯がとても鋭いので注意。",
  e:"塩焼き、刺身、ムニエル。やわらかい白身。",
  t:"体の銀色の膜（グアニン）は、昔は模造真珠の材料に使われた。"},
 {n:"ヒラマサ",r:4,a:"沖（船）",z:[60,150],s:{k:"sp",r:.25,b:"#3d6f7a",u:"#eef3f4",n:"#d8c45a",p:"yline",pc:"#f0d24a",dor:"two"},
  f:"ブリによく似るが、黄色い線がはっきりしていて、より細長い。",
  c:"船や磯からのジギング・キャスティング。パワーは青物最強クラス。",
  e:"刺身が絶品。ブリより脂は少なめで、身がしまっている。",
  t:"上あごのはしが丸いのがヒラマサ、角ばっているのがブリ。見分けのポイント。"},
 {n:"アカアマダイ",r:3,a:"沖（船）",z:[30,45],s:{k:"sp",r:.3,b:"#e48a7a",u:"#f7dcd4",n:"#f0b0a0",x:["squarehead"],dor:"long"},
  f:"四角い頭とピンク色の体。泥の海底に巣穴を掘ってすむ。",
  c:"船から、オキアミをエサに海底近くを狙う。",
  e:"京都では「ぐじ」と呼ぶ高級魚。うろこごと焼く「若狭焼き」が名物。",
  t:"うろこがやわらかく、焼くとサクサクになる。"},
 {n:"クロマグロ",r:4,a:"沖（船）",z:[100,300],s:{k:"sp",r:.3,b:"#1b2e52",u:"#e3e8ef",n:"#d8c45a",dor:"two",x:["finlets"],tail:"moon"},
  f:"最大3mにもなる「海のスーパーカー」。高速で長い距離を泳ぐ。",
  c:"青森県の大間などで一本釣りや、大型の船からのキャスティング。",
  e:"大トロ、中トロ、赤身。お寿司の主役。",
  t:"体温を海水よりも高く保つしくみをもつ。泳ぎ続けないと呼吸できない。"},
 {n:"カンパチ",r:3,a:"沖（船）",z:[40,100],s:{k:"sp",r:.3,b:"#7a6a5a",u:"#ecebe6",n:"#c8b06a",p:"yline",pc:"#d9b84a",x:["hachi"],dor:"two"},
  f:"頭の上の黒い帯を正面から見ると「八」の字。それで「間八」。",
  c:"船からの泳がせ釣りやジギング。根に潜ろうとする強い引き。",
  e:"刺身、しゃぶしゃぶ。ブリより脂が少なく、さっぱり。",
  t:"ブリ・ヒラマサと並ぶ「ブリ御三家」。"},
 {n:"キンメダイ",r:3,a:"深海",z:[25,45],s:{k:"deep",r:.44,b:"#d93a2f",u:"#f4a49a",n:"#e8605a",eye:2.1,eyec:"#e8c040",tail:"fork"},
  f:"大きな金色の目。水深200〜800mほどの深い海にすむ。",
  c:"船から長い仕掛けを深くまで沈める。伊豆の稲取などが有名。",
  e:"煮付けが定番。しゃぶしゃぶ、干物も。",
  t:"目の奥に光を反射する層があり、わずかな光を集める。だから金色に光る。"},
 {n:"アンコウ",r:3,a:"深海",z:[40,100],s:{k:"angler",b:"#6b5a48",u:"#c9b9a2",n:"#5a4a38",p:"mottle",pc:"#4a3a28"},
  f:"大きな頭と口。頭のアンテナのような「竿」の先で小魚をおびき寄せる。",
  c:"深い海の底引き網でとれることが多い。",
  e:"あんこう鍋。体がやわらかいので吊るして切る「吊るし切り」でさばく。肝は「海のフォアグラ」。",
  t:"身・皮・肝・胃などを「七つ道具」と呼び、捨てるところがない。"},
 {n:"アカムツ",r:3,a:"深海",z:[25,40],s:{k:"sp",r:.33,b:"#e05048",u:"#f7c8c2",n:"#e87a70",eye:1.6,dor:"two"},
  f:"口の中が黒いので「ノドグロ」と呼ばれる高級魚。",
  c:"船から水深100〜300mほどの深場を狙う。",
  e:"塩焼き、煮付け、炙り寿司。白身なのにトロのような脂。",
  t:"日本海側で特に人気が高い。"},
 {n:"バラムツ",r:4,a:"深海",d:1,z:[100,200],s:{k:"sp",r:.25,b:"#2a2f36",u:"#4a5058",n:"#3a3f46",dor:"two",x:["finlets"]},
  f:"深い海にすむ大型魚。夜の船釣りでかかる。",
  c:"深海の夜釣り。かかると大物の強烈な引き。",
  e:"【食べてはダメ】身の脂の大部分が人間には消化できないワックスで、食べるとお尻から油がもれ出てしまう。日本では食品として売ることが禁止されている。",
  t:"味だけならトロのようにおいしいといわれる「禁断の魚」。"},
 {n:"アブラソコムツ",r:3,a:"深海",d:1,z:[80,150],s:{k:"sp",r:.24,b:"#3a3f45",u:"#5d646c",n:"#4a4f56",dor:"two",x:["finlets"]},
  f:"バラムツによく似た深海魚。",
  c:"深海の延縄（はえなわ）などでとれる。",
  e:"【食べてはダメ】バラムツと同じくワックスを多く含み、下痢を起こす。日本では販売禁止。",
  t:"海外では別の名前で売られて、食中毒が起きたこともある。"},
 {n:"ラブカ",r:4,a:"深海",z:[100,200],s:{k:"shark",r:.14,b:"#5a4a3a",u:"#7a6a5a",n:"#4a3a2a",x:["frill"]},
  f:"ウナギのような細長い体のサメ。歯は三つまたのような形。",
  c:"深い海の底引き網などで、ごくまれにとれる。駿河湾などで見つかる。",
  e:"一般には食べない。研究のための標本として大切にされる。",
  t:"大昔からほとんど姿を変えていない「生きた化石」。"},
 {n:"ミツクリザメ",r:4,a:"深海",z:[100,300],s:{k:"shark",r:.2,b:"#d9a3a3",u:"#efc6c6",n:"#c99090",x:["snout"]},
  f:"長くつき出した鼻先と、獲物をとるときに飛び出すあごをもつピンク色のサメ。",
  c:"深海の網にまれにかかる。東京湾の深い所でも見つかっている。",
  e:"一般には食べない。",
  t:"英語名は「ゴブリンシャーク（小鬼のサメ）」。"},
 {n:"オオクチバス",r:2,a:"川・湖",z:[25,55],s:{k:"sp",r:.32,b:"#5b6a3a",u:"#e8e6cf",n:"#7a8a5a",p:"blotchline",pc:"#2f3a1e",dor:"spiny",x:["bigmouth"]},
  f:"「ブラックバス」。大きな口で小魚やエビを丸のみする北アメリカ原産の魚。",
  c:"湖や池でのルアー釣り。ワームや水面のルアーなど攻め方が多い。",
  e:"皮に独特のにおいがあるので、皮を引けば白身のフライや唐揚げでおいしい。",
  t:"特定外来生物で、生きたまま持ち帰ったり、ほかの場所に放したりすることは法律で禁止されている。"},
 {n:"ブルーギル",r:1,a:"川・湖",z:[10,20],s:{k:"deep",r:.55,b:"#4f6a5a",u:"#e8b86a",n:"#5a7060",p:"bars",pc:"#3a4a40",x:["earspot"],dor:"spiny"},
  f:"エラぶたの先に黒い点がある、北アメリカ原産の魚。",
  c:"池や湖で、小さなハリにミミズなど。とても釣れやすい。",
  e:"食べられるが小骨が多い。フライや唐揚げ。",
  t:"特定外来生物。生きたまま運ぶことや放流は法律で禁止されている。"},
 {n:"ニジマス",r:2,a:"川・湖",z:[25,60],s:{k:"sp",r:.27,b:"#4f6a5a",u:"#f0ecef",n:"#7a8a7a",p:"spots",pc:"#2a2f2a",x:["rainbow"]},
  f:"体の横に虹色の帯がある。北アメリカ原産で、各地で養殖されている。",
  c:"管理釣り場（エリアトラウト）で、スプーンなどのルアーやエサで。",
  e:"塩焼き、ムニエル、燻製。",
  t:"海に下って大きく育ったものは「スチールヘッド」と呼ばれる。"},
 {n:"ヤマメ",r:3,a:"川・湖",z:[15,30],s:{k:"sp",r:.25,b:"#7a7a5a",u:"#f0ecdf",n:"#a0a080",p:"parr",pc:"#4a4a6a"},
  f:"体に小判のような模様（パーマーク）がある「渓流の女王」。",
  c:"山の渓流でのエサ釣りやルアー。警戒心が強く、気配を消して近づく。",
  e:"塩焼きが最高。",
  t:"海に下って大きくなったものが「サクラマス」。同じ種類なのに姿がまったくちがう。"},
 {n:"アユ",r:3,a:"川・湖",z:[15,25],s:{k:"sp",r:.22,b:"#6f7a5a",u:"#f2efdf",n:"#c8c08a",x:["yspot"]},
  f:"川の石についたコケを食べる。体からスイカやキュウリのような香りがする「香魚」。",
  c:"なわばりに入ってきたアユに体当たりさせて掛ける「友釣り」が有名。",
  e:"塩焼きが定番。内臓ごと食べるほろ苦さが魅力。",
  t:"多くは一年で一生を終える「年魚」。"},
 {n:"ニホンウナギ",r:3,a:"川・湖",z:[40,80],s:{k:"eel",r:.1,b:"#3a4a3a",u:"#d8d6b8",n:"#4a5a4a"},
  f:"細長い体で、夜に活発に動く。",
  c:"夜の川や河口で、ミミズなどをエサにしたぶっこみ釣り。",
  e:"蒲焼き。血に毒があるので生では食べない（加熱すると毒はなくなる）。",
  t:"はるか遠く、マリアナ諸島の近くの海で生まれる。絶滅危惧種に指定されている。"},
 {n:"ナマズ",r:2,a:"川・湖",z:[30,60],s:{k:"catfish",r:.2,b:"#3d3a2e",u:"#cfc8b0",n:"#4a463a",p:"mottle",pc:"#26241c",x:["barbels","longbarbels"]},
  f:"平たい頭と長いひげ。夜に獲物を探す。",
  c:"夜の川や田んぼの水路で、カエルのようなルアーや、エサで。",
  e:"天ぷら、蒲焼き。白身でくせが少ない。",
  t:"昔から地震を知らせる魚という言い伝えがある。"},
 {n:"コイ",r:2,a:"川・湖",z:[30,80],s:{k:"sp",r:.33,b:"#6a5a32",u:"#e8d8a8",n:"#8a7a4a",p:"scales",pc:"#4a3e20",x:["barbels"]},
  f:"口に2対のひげがある。日本中の川や池にいる。",
  c:"練りエサを使った吸い込み仕掛けやウキ釣り。大きいものは引きがとても強い。",
  e:"鯉こく（みそ汁）、甘露煮、洗い。寄生虫がいることがあるので、しっかり加熱するのが安心。",
  t:"口に歯がなく、のどの奥の「咽頭歯」で貝もかみくだく。"},
 {n:"リュウグウノツカイ",r:4,a:"伝説",z:[200,500],s:{k:"ribbon",r:.11,b:"#d7dde3",u:"#eef2f5",n:"#e0453c",x:["crest"],p:"spots",pc:"#8a9aa8"},
  f:"銀色の帯のような長い体に、赤いひれ。深い海にすむ。",
  c:"釣りではまず出会えない。浜に打ち上げられたり、定置網に入ったりして見つかる。",
  e:"食べた人の話では、身は水っぽく、味がほとんどしないという。",
  t:"人魚伝説のもとになったともいわれる。地震の前に現れるという言い伝えもあるが、科学的な根拠はない。"},
 {n:"シーラカンス",r:4,a:"伝説",z:[100,200],s:{k:"coela",r:.34,b:"#2a4a7a",u:"#3a5a8a",n:"#2a4a7a",p:"spots",pc:"#e8edf2"},
  f:"4億年前からほぼ姿を変えていない「生きた化石」。ひれが足のような形。",
  c:"本物は釣ってはいけない魚。国際的な条約で守られている。この図鑑では「出会えた」記録として登録される。",
  e:"身に油やワックスが多く、食べるとまずくて下痢をするといわれ、現地の漁師も食べなかった。",
  t:"1938年に南アフリカで発見されるまで、絶滅したと思われていた。"},
 {n:"マンボウ",r:4,a:"伝説",z:[100,300],s:{k:"sunfish",r:.75,b:"#8a9aa8",u:"#dfe5ea",n:"#7a8a98"},
  f:"尾びれがなく、大きな背びれとしりびれで泳ぐ。",
  c:"釣りではなく、定置網に入ることが多い。",
  e:"食べられる。身は水分が多くあっさり。腸は「コワタ」と呼ばれる珍味。",
  t:"一度に3億個ほどの卵を産むといわれる。"},

 return shuffle(c.length?c:v).sort((a,b)=>(S.seen["b"+a.i]||0)-(S.seen["b"+b.i]||0))[0]}
function startBet(){begin();const used=new Set();const n=isOpen("s3")?10:8;const ks=prior(BETK()).slice(0,n);
 const list=shuffle(ks).map(kk=>{const p=pickVar(kk.slice(2),used);used.add(p.i);return {...p,retry:false,due:isDue(kk)}});
 B={list,i:0,ok:0,combo:0,gained:0,used,retries:0};betQ()}
function betQ(){view="bet";const p=B.list[B.i];const flip=Math.random()<.5;B.flip=flip;const A=flip?p.b:p.g,Bb=flip?p.g:p.b;
 app.innerHTML=`${topbar("どっちが良い文？",`${B.i+1} / ${B.list.length}`)}
 <div class="tags"><span class="tag">${SKILLS[p.k]}</span>${p.retry?'<span class="tag retry">やり直し：別の問題で</span>':p.due?'<span class="tag rev">復習</span>':""}</div>
 <div class="ctx">${esc(p.ctx)}</div>
 <p class="howto">作文に書くなら、どっち？</p>
 <div class="choices"><button class="choice" data-c="0"><span class="ab">A</span><span>${esc(A)}</span></button><button class="choice" data-c="1"><span class="ab">B</span><span>${esc(Bb)}</span></button></div>
 <div id="fb"></div>`;bindBack();
 app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>betAns(+b.dataset.c))}
function betAns(c){const p=B.list[B.i];const goodIdx=B.flip?1:0;const ok=c===goodIdx;S.seen["b"+p.i]=(S.seen["b"+p.i]||0)+1;
 const bs=app.querySelectorAll(".choice");bs.forEach((b,i)=>{b.disabled=true;if(i===goodIdx)b.classList.add("right");else if(i===c)b.classList.add("wrong")});
 if(!p.retry)grade("k:"+p.k,ok);
 if(ok){if(!p.retry)B.ok++;B.combo++;const xp=(p.retry?5:10)+Math.min(10,(B.combo-1)*2);B.gained+=xp;addXP(xp);sOK();combo(B.combo);catchFish()}
 else{B.combo=0;sNG();const v=pickVar(p.k,B.used);B.used.add(v.i);B.list.push({...v,retry:true});B.retries++}
 document.getElementById("fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><h3>${ok?"正解！":"ざんねん"}</h3>${esc(p.why)}
  ${ok?"":`<div class="again">「${SKILLS[p.k]}」の別の問題が、このあともう一度出るよ。明日の復習にも出るよ。</div>`}</div>
  <button class="bigbtn" id="nx" style="margin-top:10px">${B.i+1<B.list.length?"つぎへ":"結果を見る"}</button>`;
 document.getElementById("nx").onclick=()=>{clearAuto();B.i++;if(B.i<B.list.length)betQ();else{const first=B.list.length-B.retries;let bonus=B.retries===0?30:0;if(bonus){B.gained+=bonus;S.xp+=bonus;save()}
  finish("bet",B.gained,`${first}問中 ${B.ok}問 一発正解`+(B.retries?`／やり直し ${B.retries}問クリア`:""),bonus?"全問一発正解ボーナス +30 XP":"")}};
 document.getElementById("nx").scrollIntoView({block:"nearest",behavior:"smooth"});if(ok)autoNext(document.getElementById("nx"))}

/* ===== 設計図ボス ===== */
let G;
const planOf=k=>PLANS.find(p=>"l:"+p.id===k);
function startPlan(){begin();S.seen.open_plan=1;save();G={used:new Set(),gained:0,retries:0,count:0};planNew(false)}
function planNew(retry){const k=prior(PLANK()).filter(k=>!G.used.has(k))[0]||prior(PLANK())[0];G.used.add(k);
 G.p=planOf(k);G.due=isDue(k);G.s=0;G.m=0;G.retry=retry;G.count++;G.picked=[];planDraw()}
function planDraw(){view="plan";const pl=G.p,pr=PROMPTS.find(p=>p.id===pl.prompt);
 if(G.s>=4)return planDone();
 const step=pl.steps[G.s];G.ord=shuffle([0,1,2]);
 app.innerHTML=`${topbar("設計図ボス",`段落 ${G.s+1} / 4`)}
 <div class="tags"><span class="tag">${pr.label}</span>${G.retry?'<span class="tag retry">やり直し：別の問題で</span>':G.due?'<span class="tag rev">復習</span>':""}</div>
 <div class="sheet" style="font-size:14px;line-height:1.9;background-image:none"><b>【問】</b> ${pr.chunks.map(c=>esc(c[1])).join("")}</div>
 <div class="slots">${[0,1,2,3].map(i=>i<G.s?`<div class="slot filled"><span class="role">${ROLES[i]}</span>${esc(pl.steps[i].o[0][0])}</div>`:i===G.s?`<div class="slot" style="border-color:var(--signal);color:var(--ink)"><b>${ROLES[i]}</b> に書くのは？</div>`:"").join("")}</div>
 <div class="choices">${G.ord.map((oi,n)=>`<button class="choice" data-o="${oi}"><span class="ab">${"ABC"[n]}</span><span>${esc(step.o[oi][0])}</span></button>`).join("")}</div>`;
 bindBack();
 app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const oi=+b.dataset.o;if(oi===0){sOK();G.s++;catchFish();planDraw()}
  else{if(b.disabled)return;G.m++;sNG();b.disabled=true;b.classList.add("wrong","shake");b.insertAdjacentHTML("beforeend",`<span class="why">× ${esc(step.o[oi][1])}</span>`);app.querySelector(".prog").textContent=`段落 ${G.s+1} / 4　まちがい ${G.m}`}})}
function planDone(){const xp=G.m===0?60:Math.max(20,60-G.m*10);G.gained+=xp;addXP(xp);grade("l:"+G.p.id,G.m===0);
 const pl=G.p;const tot=pl.steps.reduce((a,s)=>a+s.o[0][0].length+1,0);
 app.innerHTML=`${topbar("設計図ボス","完成")}
 <div class="fb ${G.m?"bad":"good"}"><h3>${G.m?`設計図 完成！（まちがい ${G.m}回）`:"ボス撃破！ノーミスで設計図完成"}</h3>
 <div class="small">できあがった設計図（約${tot}字）。本番では、この骨組みに体験の様子や考えを書き足して500〜600字にする。自分の体験に置きかえて使おう。</div></div>
 <div class="sheet" style="font-size:15px;background-image:none">${pl.steps.map(s=>"　"+esc(s.o[0][0])).join("<br>")}</div>
 ${G.m?`<div class="again">別の問題でもう一度！ノーミスになるまで続くよ。この問題は明日も出るよ。</div>`:""}
 <button class="bigbtn" id="gend">${G.m?"別の問題でやり直す":"結果を見る"}</button>`;bindBack();window.scrollTo(0,0);
 if(G.m){G.retries++;document.getElementById("gend").onclick=()=>planNew(true)}
 else{combo(3);document.getElementById("gend").onclick=()=>{grade("s:plan",G.retries===0);finish("plan",G.gained,G.retries?`${G.count}問目でノーミス`:"一発ノーミス")}}}

/* ===== 本番練習（50分・手書き） ===== */
let M,TM=null,WL=null;
function stopTimer(){if(TM){clearInterval(TM);TM=null}try{WL&&WL.release()}catch(e){}WL=null}
function startMock(){begin();S.seen.open_mock=1;save();
 const pool=PROMPTS.filter(p=>tierOK(PTIER[p.id]||1));const used=S.mock.map(m=>m.id);
 const p=shuffle(pool).sort((a,b)=>used.filter(x=>x===a.id).length-used.filter(x=>x===b.id).length)[0];
 M={p,left:50*60,run:false};mockDraw()}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function mockDraw(){view="mock";const p=M.p;
 app.innerHTML=`${topbar("本番練習（50分）","")}
 <div class="tags"><span class="tag ${p.past?"past":PTIER[p.id]===3?"hard":""}">${p.label}</span></div>
 <div class="rule">原稿用紙（20字×30行など）と鉛筆を用意。本番と同じく<b>手書き</b>で書きます。<br>はじめに5分で設計図（4段落に何を書くか）をメモしてから書き始めよう。</div>
 <div class="sheet"><b>【問】</b> ${p.chunks.map(c=>esc(c[1])).join("")}　なお、書き出しや改行の際の空欄、「、」「。」や、かぎかっこなどもそれぞれ字数に数えなさい。</div>
 <div class="card"><div class="timer" id="tm">${fmt(M.left)}</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><button class="bigbtn teal" id="go">${M.run?"一時停止":"スタート"}</button><button class="bigbtn ghost" id="fin">書き終えた</button></div></div>
 <button class="bigbtn ghost" id="swap">別の問題にする</button>`;
 bindBack();
 document.getElementById("go").onclick=()=>{if(M.run){M.run=false;stopTimer();mockDraw()}else{M.run=true;try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>WL=w).catch(()=>{})}catch(e){}
  TM=setInterval(()=>{M.left=Math.max(0,M.left-1);const el=document.getElementById("tm");if(el){el.textContent=fmt(M.left);el.classList.toggle("warn",M.left<=600)}
   if(M.left===600)tone(880,.3);if(M.left===0){stopTimer();M.run=false;[523,523,523].forEach((f,i)=>tone(f,.3,i*.4));mockCheck()}},1000);mockDraw()}};
 document.getElementById("fin").onclick=()=>{stopTimer();M.run=false;mockCheck()};
 document.getElementById("swap").onclick=()=>{stopTimer();startMock()}}
function mockCheck(){view="mockc";const used=50*60-M.left;
 app.innerHTML=`${topbar("自己チェック",`かかった時間 ${fmt(used)}`)}
 <p class="howto">書いた作文を読み返して、できたものにチェックしよう。正直に！</p>
 <ul class="checks">${CHECKS.map((c,i)=>`<li><label for="ck${i}"><input type="checkbox" id="ck${i}" ${i===8&&M.left>0?"checked":""}><span>${c}</span></label></li>`).join("")}</ul>
 <div class="rule">書いた原稿用紙の写真を、お父さんに送ろう。添削してもらえるよ。</div>
 <button class="bigbtn" id="mdone">記録する</button>`;bindBack();window.scrollTo(0,0);
 document.getElementById("mdone").onclick=()=>{const n=CHECKS.filter((_,i)=>document.getElementById("ck"+i).checked).length;
  S.mock.push({date:ymd(),id:M.p.id,score:n,min:Math.round(used/60)});save();const xp=60+n*10;addXP(xp);catchFish(3,"本番練習の大物");catchFish(3,"本番練習の大物");
  const wb=ymd()>=WB_START&&ymd()<=WB_END?S.mock.filter(m=>m.date>=WB_START&&m.date<=WB_END).length:0;
  finish("mock",xp,`自己チェック ${n} / ${CHECKS.length}`,wb?`冬休み本番チャレンジ ${Math.min(wb,WB_GOAL)} / ${WB_GOAL}`:"")}}

/* ===== 結果 ===== */
function markDone(key){const d=today();d[key]=true;const r={bonus:0,complete:false,item:null};
 if(missionKeys().every(k=>d[k])&&!d.bonus){d.bonus=true;S.xp+=50;r.bonus=50;r.complete=true;
  const st=streak();const it=ITEMS.find(i=>i.d<=st&&!S.items[i.name]);if(it){S.items[it.name]=ymd();r.item=it}}
 save();return r}
function finish(key,gained,line,extra){stopTimer();const r=markDone(key);if(r.complete){const c=catchFish(3,"ミッション全クリアの大物");}gained+=r.bonus;view="res";const L=lvOf(S.xp),L0=lvOf(X0);
 const notes=[extra,r.bonus?"今日のミッション全クリア！ +50 XP":""].filter(Boolean);
 const mk=missionKeys(),d=today(),left=mk.filter(k=>!d[k]);
 app.innerHTML=`<div class="res"><h2>クエスト完了</h2><div class="score">+${gained} XP</div><div>${line}</div>${notes.map(t=>`<div class="note">${t}</div>`).join("")}
 <div class="small">Lv.${L} ${titleOf(L).name}／つぎのレベルまで あと ${xpFor(L+1)-S.xp} XP</div>
 ${left.length&&mk.includes(key)?`<div class="small">今日のミッション 残り：${left.map(k=>GAMES[k].name).join("・")}</div>`:""}
 ${left.length&&mk.includes(key)?`<button class="bigbtn" id="nextm">つぎのミッションへ：${GAMES[left[0]].name}</button>`:""}
 ${CATCH.length?`<section class="card catches"><h2>今回つれた魚 <span class="small">${CATCH.length}匹（タップで解説）</span></h2><div class="clist">${CATCH.map((c,i)=>`<button class="citem" data-i="${i}"><span class="cpic"></span><span class="cn">${c.isNew?'<b class="newb">NEW</b>':c.big?'<b class="newb rec">記録更新</b>':""}${esc(c.f.n)} <span class="small">${c.z}cm</span></span><span class="cs">${c.label?`<b>${c.label}</b> `:""}${esc(c.f.f)}</span>${c.f.d?'<span class="cd">⚠ 危険な魚</span>':""}</button>`).join("")}</div></section>`:""}
 <button class="bigbtn ${left.length&&mk.includes(key)?"ghost":""}" id="again">もう1回チャレンジ</button><button class="bigbtn ghost" id="hm">ホームへ</button></div>`;
 const nm=document.getElementById("nextm");if(nm)nm.onclick=()=>GAMES[left[0]].start();
 app.querySelectorAll(".citem").forEach(b=>{const c=CATCH[+b.dataset.i];b.querySelector(".cpic").appendChild(fishCanvas(c.f,120));b.onclick=()=>fishDetail(c.f)});
 document.getElementById("again").onclick=()=>GAMES[key].start();
 document.getElementById("hm").onclick=home;window.scrollTo(0,0);
 const seq=[];if(L>L0)seq.push(ovLevel(L0,L));
 newUnlocks().forEach(u=>seq.push(ovUnlock(u)));
 if(r.complete)seq.push(ovDay(streak(),nextItem()));
 if(r.item)seq.push(ovItem(r.item));
 const zc=zCount();ZMILE.filter(m=>zc>=m&&!S.zmile.includes(m)).forEach(m=>{S.zmile.push(m);seq.push(()=>{sLV();return ovBox(`<div class="sm">さかな図鑑</div><div class="big">${m}種 達成！</div><div class="sm">あと${FISH.length-zc}種で図鑑完成。めざせ、さかな博士！</div>`)})});
 if(zc===FISH.length&&!S.zmile.includes("all")){S.zmile.push("all");seq.push(()=>{sDAY();return ovBox(`<div class="big">図鑑<br>コンプリート！</div><div class="mid">さかな博士に認定！</div><div class="sm">全${FISH.length}種の魚を釣り上げた。本番の作文も、きっと大物が釣れる！</div>`,"whale")})}
 save();
 setTimeout(()=>playSeq(seq),600)}

home();
(()=>{const n=newUnlocks();if(n.length&&S.xp>0)setTimeout(()=>playSeq(n.map(ovUnlock)),500)})();

</script>
